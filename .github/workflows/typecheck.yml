name: TypeCheck

on:
  push:
    branches:
      - main
      - develop
    paths:
      - '**.ts'
      - '**.tsx'
      - '**/tsconfig.json'
      - '**/tsconfig.*.json'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'packages/*/package.json'
      - 'shared/*/package.json'
      - '.github/workflows/typecheck.yml'
  pull_request:
    paths:
      - '**.ts'
      - '**.tsx'
      - '**/tsconfig.json'
      - '**/tsconfig.*.json'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'packages/*/package.json'
      - 'shared/*/package.json'
      - '.github/workflows/typecheck.yml'

defaults:
  run:
    shell: 'bash'

jobs:
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm run build --scope "@bigcapital/utils" --scope "@bigcapital/email-components" --scope "@bigcapital/pdf-templates" --scope "@bigcapital/sdk-ts"

      - name: Type check server (blocking)
        run: pnpm run typecheck --scope "@bigcapital/server"

      # Upstream's webapp fails its own TypeCheck on develop (~150 errors of
      # pre-existing type debt, exposed by their sdk-ts types). Non-blocking
      # until upstream is green; re-tighten then.
      - name: Type check webapp + shared (non-blocking)
        continue-on-error: true
        run: pnpm run typecheck --ignore "@bigcapital/server"
